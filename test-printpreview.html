<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Print Preview Test</title>
<style>
  body { font-family: sans-serif; margin: 40px; color: #222; }
  h1 { color: #1a73e8; }
  .box { background: linear-gradient(135deg,#ff6b6b,#4ecdc4); color:#fff;
         padding: 24px; border-radius: 12px; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; }
  td, th { border: 1px solid #ccc; padding: 8px 12px; }
  th { background: #f1f3f4; }
</style>
</head>
<body>
  <h1>skia-fx Print Preview Test Page</h1>
  <p>This page auto-opens the print preview so the generated PDF can be verified.</p>
  <div class="box">A gradient block to confirm the PDF rasterizes graphics.</div>
  <table>
    <tr><th>Row</th><th>Value</th></tr>
    <tr><td>1</td><td>Alpha</td></tr>
    <tr><td>2</td><td>Bravo</td></tr>
    <tr><td>3</td><td>Charlie</td></tr>
  </table>
  <script>
    // Give the page a beat to paint, then open the print preview.
    window.addEventListener('load', function () {
      setTimeout(function () { window.print(); }, 1500);
    });
  </script>
</body>
</html>
