/*
 * javafx.media — copied from upstream, ours to modify.
 *
 * MediaView and AudioClip. Heavy native side (gstreamer / AVFoundation /
 * MediaFoundation depending on platform). v1 goal: keep it building and
 * working unchanged. Skia integration only matters where MediaView
 * frames need to land on a SkSurface (phase 2+).
 */

plugins {
    id 'skiafx.java-conventions'
    id 'skiafx.module-conventions'
    // ffmpeg-conventions and matroska-conventions have to be applied
    // BEFORE native-conventions so the latter sees `ext.ffmpegIncludeDir`
    // / `ext.gstMatroskaDir` and can pass them to CMake. Order matters.
    id 'skiafx.ffmpeg-conventions'
    id 'skiafx.matroska-conventions'
    id 'skiafx.native-conventions'
    id 'skiafx.upstream-sync'
    id 'skiafx.sdk-conventions'
}

upstream {
    trackedFromJfxMaster 'modules/javafx.media'
}

dependencies {
    api project(':javafx.base')
    api project(':javafx.graphics')
}

// JNI headers (com_sun_media_*.h) are generated by javac -h, alongside
// compileJava. jfxmedia.dll's .cpp sources #include these. CMake picks
// up the directory via OPENJFX_JNI_HEADERS_DIR (wired by the native
// convention plugin).
def jniHeaderDir = layout.buildDirectory.dir('generated/sources/headers/java/main')
tasks.withType(JavaCompile).configureEach {
    options.headerOutputDirectory.set(jniHeaderDir)
}
ext.jniHeaderDir = jniHeaderDir

// jfxmedia_errors.h is generated from the MediaError Java enum by the
// upstream tool at src/tools/java/headergen/HeaderGen.java. Compile
// the tool, then run it to emit the header alongside the JNI headers
// so it lands on the same -I path used by the native build.
def mediaErrorsHeader = jniHeaderDir.map { it.file('jfxmedia_errors.h') }

def headerGenClassesDir = layout.buildDirectory.dir('classes/headergen')
def compileHeaderGen = tasks.register('compileHeaderGen', JavaCompile) {
    description = 'Compile the HeaderGen tool used to generate jfxmedia_errors.h'
    source(file('src/tools/java'))
    destinationDirectory.set(headerGenClassesDir)
    // HeaderGen imports com.sun.media.jfxmedia.MediaError → needs the
    // module's main classes on its classpath.
    dependsOn 'compileJava'
    classpath = files(layout.buildDirectory.dir('classes/java/main'))
    options.release.set(25)
}

// Capture these as Provider-typed values at configuration time so the
// JavaExec task is config-cache compatible (no `file()` calls inside
// the doFirst closure at execution time).
def mediaErrorsHeaderFile = mediaErrorsHeader
def mediaSrcJavaDir = layout.projectDirectory.dir('src/main/java')
def generateMediaErrors = tasks.register('generateMediaErrors', JavaExec) {
    description = 'Generate jfxmedia_errors.h from the MediaError enum'
    dependsOn compileHeaderGen
    outputs.file(mediaErrorsHeaderFile)
    classpath(headerGenClassesDir, layout.buildDirectory.dir('classes/java/main'))
    mainClass.set('headergen.HeaderGen')
    argumentProviders.add({
        [mediaErrorsHeaderFile.get().asFile.absolutePath,
         mediaSrcJavaDir.asFile.absolutePath] as Iterable<String>
    } as CommandLineArgumentProvider)
    doFirst {
        mediaErrorsHeaderFile.get().asFile.parentFile.mkdirs()
    }
}

// nativeConfigure (wired in skiafx.native-conventions) compiles Java
// first, but we also need the generated header before CMake runs.
tasks.matching { it.name == 'nativeConfigure' }.configureEach {
    dependsOn generateMediaErrors
}

description = 'JavaFX media module.'
