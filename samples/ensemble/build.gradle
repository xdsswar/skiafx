/*
 * samples/ensemble — sample apps for the skia-fx pipeline.
 *
 * Tasks:
 *   :samples:ensemble:run             — DashboardApp (default)
 *   :samples:ensemble:runDemo3D       — Demo3D (3D scene-graph showcase)
 *   :samples:ensemble:runMediaSmoke   — MediaSmokeApp (audio/video smoke)
 *   :samples:ensemble:runPlayer       — VideoPlayerApp (file picker)
 *
 * Optional flags (none required — Skia, GPU, D3D11VA zero-copy and
 * dirty-opts are all default-on in skia-fx):
 *   -PffmpegDir=C:/ffmpeg/bin     ffmpeg DLL location for ffmpeg-backed
 *                                 decode. Forwarded as -Dopenjfx.media
 *                                 .ffmpeg.dir; when omitted the engine
 *                                 falls back to mfwrapper / dshowwrapper.
 *   --args="C:/path/to/clip.mp4"  pre-load this file (runPlayer only).
 */

plugins {
    id 'skiafx.java-conventions'
    id 'application'
}

// Per-module repository (settings.gradle keeps the build otherwise hermetic).
// Needed only for the AtlantaFX theme used by the Showcase sample.
repositories {
    mavenCentral()
}

dependencies {
    implementation project(':javafx.base')
    implementation project(':javafx.graphics')
    implementation project(':javafx.scene3d')
    implementation project(':javafx.controls')
    implementation project(':javafx.fxml')
    implementation project(':javafx.media')
    implementation project(':javafx.web')

    // AtlantaFX PrimerLight theme for the Showcase (a CSS-heavy modern theme to
    // stress the Skia CSS/render path). Exclude its transitive org.openjfx
    // dependency so it resolves against OUR javafx.* project modules, not the
    // stock OpenJFX jars from Maven Central.
    implementation('io.github.mkpaz:atlantafx-base:2.0.1') {
        exclude group: 'org.openjfx'
    }
}

application {
    mainClass  = 'org.openjfx.samples.ensemble.DashboardApp'
    mainModule = 'openjfx.samples.ensemble'
    applicationDefaultJvmArgs = [
        '--enable-preview',
        '--enable-native-access=ALL-UNNAMED',
    ]
}

// ----------------------------------------------------------------------
// Dev-tree run config — common to every sample task.
//
// We launch against the in-tree build outputs rather than a packaged
// SDK, so we have to point `java.library.path` at javafx.graphics +
// javafx.media native dirs and tell NativeBridge where the Skia bridge
// DLL lives. A downstream user with a real SDK doesn't need any of
// this — `java --module-path sdk/lib --add-modules javafx.controls`
// works the same way it does with stock OpenJFX 25.
// ----------------------------------------------------------------------

// Per-platform native dirs. The skiafx.native-conventions plugin
// exposes nativePlatform ('win'|'mac'|'linux') and nativeArch
// ('x64'|'arm64'); replicate that logic here so the samples module
// stays portable without depending on the convention plugin.
def repoRoot = rootDir
def hostOs   = System.getProperty('os.name').toLowerCase()
def hostPlat = hostOs.contains('win')  ? 'win'
            : hostOs.contains('mac')   ? 'mac'
            : 'linux'
def hostArch = (System.getProperty('os.arch') in ['x86_64', 'amd64']) ? 'x64' : 'arm64'
def graphicsLib = new File(repoRoot,
    "javafx.graphics/build/native/${hostPlat}-${hostArch}/lib")
def mediaLib    = new File(repoRoot,
    "javafx.media/build/native/${hostPlat}-${hostArch}/lib")
// javafx.scene3d ships its own native asset lib (openjfx_model3d) in a
// separate build dir; the model demo points the loader at it explicitly.
def scene3dLib  = new File(repoRoot,
    "javafx.scene3d/build/native/${hostPlat}-${hostArch}/lib")
def model3dBridgeName = hostPlat == 'win'  ? 'openjfx_model3d.dll'
                      : hostPlat == 'mac'  ? 'libopenjfx_model3d.dylib'
                                           : 'libopenjfx_model3d.so'
def model3dBridge = new File(scene3dLib, model3dBridgeName)
// WebKit's native build dir uses the 'webkit-<platform>-<arch>' prefix
// (see skiafx.webkit-native-conventions.gradle).
def webLib      = new File(repoRoot,
    "javafx.web/build/native/webkit-${hostPlat}-${hostArch}/bin")
def skiaBridgeName = hostPlat == 'win'  ? 'openjfx_skia_shared.dll'
                   : hostPlat == 'mac'  ? 'libopenjfx_skia_shared.dylib'
                                        : 'libopenjfx_skia_shared.so'
def skiaBridge  = new File(graphicsLib, skiaBridgeName)

// Optional: ffmpeg DLL directory. Resolved from (in order):
//   -PffmpegDir=...                             explicit user override
//   OPENJFX_MEDIA_FFMPEG_DIR env var            shell convention
//   javafx.media's auto-fetched dev runtime     fetched by the dev build
//
// Forwarded as -Dopenjfx.media.ffmpeg.dir, which is the canonical
// system property; NativeMediaManager picks it up automatically on
// first Media construction.
def ffmpegDir = providers.gradleProperty('ffmpegDir')
                        .orElse(providers.environmentVariable('OPENJFX_MEDIA_FFMPEG_DIR'))
                        .orElse(provider {
                            def mp = project(':javafx.media')
                            mp.hasProperty('ffmpegRuntimeDir') ?
                                (String) mp.ext.ffmpegRuntimeDir : null
                        })
                        .getOrNull()

def applyDevTreeRunConfig = { JavaExec t ->
    t.doFirst {
        systemProperty 'java.library.path',
            "${graphicsLib.absolutePath}${File.pathSeparator}${mediaLib.absolutePath}${File.pathSeparator}${webLib.absolutePath}"
        if (skiaBridge.exists()) {
            systemProperty 'openjfx.skia.nativeLib', skiaBridge.absolutePath
        }
        if (ffmpegDir != null && !ffmpegDir.isBlank()) {
            systemProperty 'openjfx.media.ffmpeg.dir', ffmpegDir
        }
    }
    if (ffmpegDir != null && providers.gradleProperty('ffmpegDir').getOrNull() == null) {
        // The default ffmpegDir comes from the dev auto-fetch task —
        // depend on it so the DLLs exist before launch. An explicit
        // -PffmpegDir override skips the fetch entirely.
        def mediaProject = project(':javafx.media')
        if (mediaProject.tasks.findByName('fetchFfmpegRuntime')) {
            t.dependsOn mediaProject.tasks.named('fetchFfmpegRuntime')
        }
    }
}

tasks.named('run') {
    applyDevTreeRunConfig(it)
}

