tasks.register('runDemo3D', JavaExec) {
    group = 'application'
    description = 'Launch Demo3D (3D scene-graph showcase: meshes, lights, camera).'
    dependsOn 'classes'
    classpath  = sourceSets.main.runtimeClasspath
    mainClass.set('org.openjfx.samples.ensemble.Demo3D')
    mainModule.set('openjfx.samples.ensemble')
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
    applyDevTreeRunConfig(it)
    // 3D needs the D3D12 backend (bgfx shares Skia's D3D12 device). Enable
    // it BY DEFAULT so the demo shows real 3D when launched straight from
    // the IntelliJ Gradle sidebar (or `gradlew runDemo3D`) with no args.
    // SCENE3D is gated on this; without it the demo shows the "unsupported"
    // panel. Override with -POPENJFX_SKIA_D3D=0 to force the GL backend.
    environment 'OPENJFX_SKIA_D3D', '1'
    // Shadows are opt-in in the renderer (fixed-sun first increment); enable them by
    // default in this showcase. Override with -POPENJFX_SKIA_3D_SHADOWS=0.
    environment 'OPENJFX_SKIA_3D_SHADOWS', '1'
    // 3D spike (docs/3D.md Increment 1). Forward the JVM flag that gates
    // the SkiaPresentable.present() hook from -Pskia.3d.spike / -D...
    ['skia.3d.spike', 'skia.3d.selftest', 'skia.3d.parallelcam'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getProperty(k)
        if (v != null) systemProperty k, v.toString()
    }
    // Native-side env vars (read with getenv in the C++ bridge). Allow
    // overriding the defaults above via -P<k>=... or an inherited shell var.
    ['OPENJFX_SKIA_D3D', 'OPENJFX_SKIA_3D_DIAG', 'OPENJFX_SKIA_D3D_DIAG',
     'OPENJFX_SKIA_3D_SHADOWS'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getenv(k)
        if (v != null) environment k, v.toString()
    }
}

tasks.register('runModelDemo', JavaExec) {
    group = 'application'
    description = 'Launch Model3DDemo (glTF 2.0 model loading via javafx.scene3d). ' +
        '-Dmodel.file=<path> loads a custom model; -Pmodel.selftest=true runs headless ' +
        'asserts; -Pfullspeed uncaps the frame rate (dramatic VSync on/off fps swing).'
    dependsOn 'classes'
    // The scene3d native lib must exist before launch.
    dependsOn ':javafx.scene3d:nativeBuild'
    classpath  = sourceSets.main.runtimeClasspath
    mainClass.set('org.openjfx.samples.ensemble.Model3DDemo')
    mainModule.set('openjfx.samples.ensemble')
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED',
            // javafx.scene3d (a named module) calls FFM restricted methods, so it
            // needs native access in addition to the unnamed app module.
            '--enable-native-access=javafx.scene3d'
    applyDevTreeRunConfig(it)
    // 3D needs the D3D12 backend (bgfx shares Skia's device), like runDemo3D.
    environment 'OPENJFX_SKIA_D3D', '1'
    environment 'OPENJFX_SKIA_3D_SHADOWS', '1'
    doFirst {
        // Point the loader at the freshly built dev-tree native lib (the
        // deployed path extracts it from the jar instead).
        if (model3dBridge.exists()) {
            systemProperty 'openjfx.model3d.nativeLib', model3dBridge.absolutePath
        }
    }
    // Forward model.* flags from -P<k>=... or -D<k>=... (config time → task input).
    ['model.file', 'model.selftest', 'skia.verbose'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getProperty(k)
        if (v != null) systemProperty k, v.toString()
    }
    ['OPENJFX_SKIA_D3D', 'OPENJFX_SKIA_3D_DIAG', 'OPENJFX_SKIA_3D_SHADOWS'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getenv(k)
        if (v != null) environment k, v.toString()
    }
    // -Pfullspeed[=true] uncaps the master timer (javafx.animation.fullspeed) so
    // the pulse — and the uncapped present path — can exceed the display refresh.
    // Makes the VSync on/off fps difference dramatic. -Pfullspeed=false disables.
    def fullspeed = project.findProperty('fullspeed')
    if (fullspeed != null && fullspeed.toString() != 'false') {
        systemProperty 'javafx.animation.fullspeed', 'true'
    }
}

tasks.register('runPlayer', JavaExec) {
    group = 'application'
    description = 'Launch VideoPlayerApp (file picker + drag-drop).'
    dependsOn 'classes'
    classpath  = sourceSets.main.runtimeClasspath
    mainClass.set('org.openjfx.samples.ensemble.VideoPlayerApp')
    mainModule.set('openjfx.samples.ensemble')
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
    // Bulletproof default: route around the WGL_NV_DX_interop2
    // zero-copy path which hangs the FX thread on swap-chain
    // resize (maximize / restore / fullscreen toggle). The
    // producer's HW path emits meta-only buffers that only the
    // zero-copy consumer can read, so when zero-copy is off the
    // producer must also avoid hwaccel — both flags flip together.
    // Override with `-PuseHwaccel=true` to A/B test on a driver
    // where the WGL layer is well behaved.
    // ffmpeg D3D11VA hwaccel is on by default — the freeze that made
    // us turn it off was fixed at the source (bounded effect-validate
    // retry in PrEffectHelper + a non-null-image SkiaPassthroughPeer).
    // Override with `-PuseHwaccel=false` to force software decode for
    // A/B comparison.
    def useHw = providers.gradleProperty('useHwaccel').getOrElse('true')
    environment 'OPENJFX_MEDIA_USE_HWACCEL', useHw
    // Force every video stream through ffmpegwrapper when ffmpeg can
    // decode it — even for codecs MFT/DirectShow can also handle.
    // ffmpegwrapper preserves the source's full colour metadata
    // (mfwrapper strips it), so this is the reliable path for
    // colour-correct playback of AV1 / HEVC / etc.
    def forceFfmpeg = providers.gradleProperty('forceFfmpeg').getOrElse('false')
    environment 'OPENJFX_MEDIA_FORCE_FFMPEG', forceFfmpeg
    // Manual colour overrides (HW path + Skia consumer). All three
    // accept "auto" (default — engine detects) or a token:
    //
    //   -PyuvMatrix=<auto|601|smpte170|bt470bg|pal|fcc|709|bt709|
    //                 2020|bt2020|smpte240|rgb>
    //   -PyuvRange=<auto|full|limited>          (HW path)
    //   -PyuvColorSpace=<auto|0|1|2|3>          (Skia consumer:
    //                                             0=601, 1=709,
    //                                             2=2020, 3=JPEG-full)
    //
    // The full range of tokens is here so a developer can A/B test
    // every standard YUV configuration when a specific file's
    // colour metadata is wrong or missing.
    def yuvMatrix = providers.gradleProperty('yuvMatrix').getOrElse('auto')
    environment 'OPENJFX_MEDIA_YUV_MATRIX', yuvMatrix
    def yuvRange = providers.gradleProperty('yuvRange').getOrElse('auto')
    environment 'OPENJFX_MEDIA_YUV_RANGE', yuvRange
    // Modern DXGI colour-space override (HW path). Accepts a token
    // that picks one of DXGI_COLOR_SPACE_TYPE's named enums:
    //   bt709 / bt709-full
    //   bt601 / bt601-full / smpte170
    //   bt2020 / bt2020-full
    //   bt2020-pq                (HDR10)
    //   bt2020-hlg               (Hybrid Log-Gamma)
    //   rgb-full / rgb-studio
    //   auto                     (default — engine detects)
    def yuvDxgi = providers.gradleProperty('dxgiColorSpace').getOrElse('auto')
    if (yuvDxgi != 'auto') {
        environment 'OPENJFX_MEDIA_YUV_COLORSPACE', yuvDxgi
    }
    def yuvColorSpace = providers.gradleProperty('yuvColorSpace').getOrElse('auto')
    if (yuvColorSpace != 'auto') {
        systemProperty 'skia.media.yuvColorSpace', yuvColorSpace
    } else if (yuvMatrix != 'auto') {
        // Keep Skia consumer-side aligned to a matrix override when
        // the user didn't set yuvColorSpace explicitly.
        def consumerValue = (yuvMatrix.contains('601') || yuvMatrix.contains('smpte170')
                            || yuvMatrix.contains('470') || yuvMatrix.contains('pal')
                            || yuvMatrix.contains('fcc')) ? '0'
                          : (yuvMatrix.contains('2020')) ? '2'
                          : (yuvMatrix.contains('709') || yuvMatrix.contains('240')) ? '1'
                          : '-1'
        if (consumerValue != '-1') {
            systemProperty 'skia.media.yuvColorSpace', consumerValue
        }
    }

    // HDR pipeline. SkiaMediaTexture detects HDR PQ / HLG content and
    // either tone-maps on the GPU (via the SkRuntimeEffect BT.2390
    // pass added to the Skia bridge) or in pure Java (LUT-based
    // PQ EOTF + BT.2020→sRGB + BT.2390 + sRGB OETF). System properties:
    //
    //   -PhdrPath=<auto|gpu|cpu|off>     auto = GPU if native built,
    //                                     CPU otherwise.
    //   -PhdrPeakNits=<N>                source mastering peak (default
    //                                     0 = auto, falls back to 1000
    //                                     for HDR content lacking
    //                                     metadata).
    //   -PhdrDisplayNits=<N>             display target peak (default
    //                                     100 = SDR sRGB).
    //   -PforceHdr=<auto|pq|hlg|sdr|709> pretend the source has this
    //                                     transfer regardless of caps —
    //                                     useful for testing HDR with
    //                                     a file whose metadata didn't
    //                                     reach the consumer.
    def hdrPath = providers.gradleProperty('hdrPath').getOrElse('auto')
    systemProperty 'skia.media.hdrPath', hdrPath
    def hdrPeak = providers.gradleProperty('hdrPeakNits').getOrElse('0')
    systemProperty 'skia.media.hdrPeakNits', hdrPeak
    def hdrDisp = providers.gradleProperty('hdrDisplayNits').getOrElse('100')
    systemProperty 'skia.media.hdrDisplayNits', hdrDisp
    def forceHdr = providers.gradleProperty('forceHdr').getOrElse('auto')
    systemProperty 'skia.media.forceHdr', forceHdr

    applyDevTreeRunConfig(it)
}

description = 'Sample apps for the Skia pipeline.'
