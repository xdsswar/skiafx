tasks.register('runWebView', JavaExec) {
    group = 'application'
    description = 'Launch WebViewDemo (exercises batch 4 image + batch 5 text/emoji native paths).'
    dependsOn 'classes'
    classpath  = sourceSets.main.runtimeClasspath
    mainClass.set('org.openjfx.samples.ensemble.WebViewDemo')
    mainModule.set('openjfx.samples.ensemble')
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
    applyDevTreeRunConfig(it)
    // Forward diagnostic flags from the gradlew CLI to the app JVM, at
    // CONFIGURATION time (Project access is allowed here; only EXECUTION-time
    // Project access breaks the configuration cache). Accept both -P<k>=... (a
    // Gradle/project property) and -D<k>=... (a JVM system property on the
    // gradle process). Setting systemProperty at config time makes it a proper
    // task input, so changing the flag re-runs the task.
    ['webdemo.page', 'skia.verbose', 'skia.web.nativeShadow',
     'prism.dirtyopts', 'prism.showdirty', 'prism.verbose',
     'skia.effect.diag', 'skia.effect.dump',
     'skia.resize.diag', 'skia.paint.diag'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getProperty(k)
        if (v != null) systemProperty k, v.toString()
    }
    // Native-side diagnostics are read with getenv() in the C++ bridge, so they
    // must reach the forked app JVM as an ENVIRONMENT variable (a system
    // property won't do). Forwarding via environment() here is daemon-proof —
    // it doesn't depend on the gradle daemon having inherited the var.
    ['OPENJFX_SKIA_PRESENT_DIAG', 'OPENJFX_PDF_PLUGIN'].each { k ->
        def v = project.findProperty(k)
        if (v == null) v = System.getenv(k)
        if (v != null) environment k, v.toString()
    }
}

