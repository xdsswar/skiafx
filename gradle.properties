# =============================================================================
# Build behavior
# =============================================================================
# Gradle 9 enables configuration cache by default; keep it explicit so
# the intent is visible.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# Parallel project configuration & execution.
org.gradle.parallel=true
org.gradle.caching=true

# Isolated Projects — experimental in Gradle 9, beneficial for our
# modular layout but masks Groovy compilation errors with cryptic
# "BUG! exception in phase 'semantic analysis'" output. Off during
# initial bring-up; flip back on with -Porg.gradle.unsafe.isolated-projects=true
# once the build is stable.
org.gradle.unsafe.isolated-projects=false

# Daemon JVM args. The daemon runs on JDK 17+ (toolchain handles JDK 25
# for project compilation separately).
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# =============================================================================
# Project metadata
# =============================================================================
# skia-fx is a drop-in compatible Skia-backed rendering pipeline for
# OpenJFX. The PUBLISHED version stays the upstream JFX release so
# artifact filenames match stock OpenJFX (javafx.base-25.0.0.jar). The
# skia-fx overlay version lives in MANIFEST.MF Implementation-Version
# only — see gradle/libs.versions.toml.
group=dev.skiafx

# =============================================================================
# Override hooks (uncomment / set on the CLI to override catalog values).
# All overrides documented in CLAUDE.md "Version pinning and overrides".
# =============================================================================
# skiafxVersion=0.2.0-dev
# skijaVersion=0.117.0
# javaVersion=26

# =============================================================================
# javafx.web — Blink engine (skia-fx-webview) native build
# =============================================================================
# Everything here is configurable; override any value on the CLI with
# -P<key>=<value>.
#
# Native build enabled project-wide so `buildAll` (and any :javafx.web
# assemble/jar) builds the engine too: configureBuild -> buildNatives ->
# copyNativeEngine -> generateChecksums -> jar. NOTE: this makes a full
# `buildAll` run the multi-hour ninja compile. The checkout must be seeded
# once first (./gradlew :javafx.web:seedChromium). Set to false to skip the
# native build (jar still packs any previously-built engine artifacts).
buildWebNative=true
#
# Chromium version to checkout — full long version string. Set specifically
# to pin the engine; override with -Pchromium.version=<x.y.z.w>.
chromium.version=147.0.7727.56
chromium.channel=stable
chromium.syncJobs=4
# release (monolithic, optimized, optimize_for_size) | debug
chromium.buildType=release
# Output dir under <chromiumHome>/chromium/src/out/
chromium.buildDir=skiafxweb
# Max parallel ninja jobs (empty = all cores). Lower if RAM-constrained.
# chromium.buildJobs=8

# Isolated checkout workspace (gitignored). Default <repoRoot>/.chromium.
# chromiumHome=F:/path/to/.chromium
# Source checkout seeded by `seedChromium` (full isolated copy, no re-download).
# juxCheckout=F:/DEV/jux-framework-blink/chromium
# juxDepotTools=F:/DEV/jux-framework-blink/depot_tools

# --- Codecs (open by default — safe to redistribute) ---
chromium.codecs.proprietary=false
chromium.codecs.hevc=false
chromium.codecs.dolbyVision=false

# --- Content-layer features ---
# PDF + printing dropped for size. On Windows the printing stack requires PDF,
# so they go together; the engine's print handlers compile to no-ops (guarded
# by SFXWEB_ENABLE_PRINTING). Re-enable BOTH together to restore printing.
chromium.feature.pdf=true
chromium.feature.printing=true
chromium.feature.printPreview=true

# Internal PDF plugin (PdfViewWebPlugin) renders the print-preview document. The
# DEPS-managed third_party/ink source is absent in our isolated checkout, so build
# pdfium with ink2 (and save-to-Drive) OFF — they pull third_party/ink / Drive deps.
chromium.gn.enable_pdf_ink2=false
chromium.gn.enable_pdf_save_to_drive=false
# components/pdf/renderer (the PDF plugin) includes the screen_ai mojom header
# unconditionally; its mojom target assert()s this flag, so it must be ON.
chromium.gn.enable_screen_ai_service=true
# NOTE (Skia-rendered <select> dropdowns — planned): setting
#   chromium.gn.use_external_popup_menu=true
# makes Blink hand <select> items to the browser via WebContentsViewAura::
# ShowPopupMenu (today a NOTIMPLEMENTED stub) with a PopupMenuClient mojo remote,
# instead of drawing the dropdown itself. Enabling it is build-wide and breaks ALL
# selects until the full chain is wired (content patch → jux hook → Java Skia list
# → DidAcceptIndices). Kept OFF until that lands atomically. See task #33 / memory.

# --- Arbitrary GN flag overrides ---
# Any GN arg is settable: -Pchromium.gn.<flag>=<value> wins over the built-in
# default (value emitted verbatim, e.g. -Pchromium.gn.enable_webrtc=true or
# -Pchromium.gn.ffmpeg_branding="Chrome"). For flags not in the defaults, use
# the raw escape hatch: -Pchromium.extraGnArgs="foo = true\nbar = false".
# chromium.gn.enable_webrtc=false
