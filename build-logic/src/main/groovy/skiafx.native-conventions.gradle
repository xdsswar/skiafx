/*
 * skiafx.native-conventions
 *
 * Drives native compilation through CMake from Gradle. CMake is an
 * implementation detail (CLAUDE.md mandate); the developer-facing
 * interface is `./gradlew :module:nativeCompile`.
 *
 * NOTE: The `OPENJFX_*` CMake variable names below are kept verbatim
 * to match the per-module CMakeLists.txt files already in the tree.
 * Renaming them would require coordinated edits across every native
 * source root — a separate cleanup, not part of the structural
 * migration.
 *
 * Convention:
 *   - Each subproject owns one CMake source root. By default that
 *     root is `src/main/native-skia/` (graphics module's legacy
 *     name). Modules may override via `ext.nativeSourceDir =
 *     'src/main/native'` (set in build.gradle BEFORE applying this
 *     convention works only if the override is checked at task
 *     configuration time — we read it lazily via project.properties
 *     so set-after-apply works too).
 *   - Build outputs land in build/native/<platform>-<arch>/.
 */

import org.gradle.internal.os.OperatingSystem

def libs = project.extensions.getByType(VersionCatalogsExtension).named('libs')
def cmakeMin  = providers.gradleProperty('cmakeMin').orElse(libs.findVersion('cmake-min').get().requiredVersion).get()

def os = OperatingSystem.current()
def hostPlatform = os.windows ? 'win'
                 : os.macOsX  ? 'mac'
                 : 'linux'
def hostArch = (System.getProperty('os.arch') in ['x86_64', 'amd64']) ? 'x64' : 'arm64'

ext.nativePlatform = hostPlatform
ext.nativeArch     = hostArch

// Per-module CMake source root. The convention probes two known
// paths in order: the legacy `src/main/native-skia` (used by
// javafx.graphics) and the generic `src/main/native` (preferred for
// new modules). First one containing a CMakeLists.txt wins.
def candidateNativeRoots = ['src/main/native-skia', 'src/main/native']
def nativeRoot = candidateNativeRoots
    .collect { layout.projectDirectory.dir(it).asFile }
    .find { new File(it, 'CMakeLists.txt').exists() }
def hasNative = nativeRoot != null

def nativeBuildDir = layout.buildDirectory.dir("native/${hostPlatform}-${hostArch}")

def nativeCompileTask = tasks.register('nativeCompile') {
    group = 'build'
    description = 'Compile native code for the host platform.'
}

if (hasNative) {
    def skiaHome = providers.gradleProperty('skiaHome')
        .orElse(providers.environmentVariable('SKIA_HOME'))
        .getOrNull()
    def buildType = providers.gradleProperty('nativeBuildType')
        .orElse('Release')
        .get()

    // On Windows we use the Visual Studio generator so MSVC is found
    // and configured automatically. Skia on Windows is built with
    // MSVC ABI (cl.exe / clang-cl), so MinGW + Skia is incompatible
    // — sticking to MSVC keeps us linkable. Linux/macOS keep Ninja.
    def useMsvc = (hostPlatform == 'win')
    def generator = useMsvc ? 'Visual Studio 17 2022' : 'Ninja'

    def jniHeaderDirProvider = layout.buildDirectory.dir('generated/sources/headers/java/main')
    def configureTask = tasks.register('nativeConfigure', Exec) {
        group = 'build'
        description = "CMake configure (${hostPlatform}-${hostArch}, ${generator})."

        // JNI headers are generated by compileJava; native code that
        // implements those JNI methods includes them.
        dependsOn 'compileJava'

        doFirst { nativeBuildDir.get().asFile.mkdirs() }

        executable 'cmake'
        def cmakeArgs = [
            '-S', nativeRoot.absolutePath,
            '-B', nativeBuildDir.get().asFile.absolutePath,
            '-G', generator,
            "-DOPENJFX_JNI_HEADERS_DIR=${jniHeaderDirProvider.get().asFile.absolutePath}",
        ]
        if (useMsvc) {
            // VS generator: pick architecture and toolset.
            cmakeArgs += ['-A', hostArch == 'x64' ? 'x64' : 'ARM64']
        } else {
            cmakeArgs << "-DCMAKE_BUILD_TYPE=${buildType}"
        }
        cmakeArgs += [
            "-DOPENJFX_SKIA_PLATFORM=${hostPlatform}",
            "-DOPENJFX_SKIA_ARCH=${hostArch}",
            "-DOPENJFX_SKIA_MIN_CMAKE=${cmakeMin}",
        ]
        if (skiaHome) {
            cmakeArgs << "-DSKIA_HOME=${skiaHome}"
        }
        // ffmpeg public headers (runtime-dynamic loader — no link
        // dependency). The skiafx.ffmpeg-conventions plugin sets
        // `ext.ffmpegIncludeDir` either to a user-supplied path or
        // to the auto-fetch output dir. Modules that don't apply
        // that convention leave it null, and CMake just skips the
        // ffmpeg-dependent sources via its own guard.
        def ffmpegInclude = project.findProperty('ffmpegIncludeDir')
        if (ffmpegInclude) {
            cmakeArgs << "-DOPENJFX_FFMPEG_INCLUDE_DIR=${ffmpegInclude}"
        }
        // matroska demuxer sources (auto-fetched by
        // skiafx.matroska-conventions). When set, gstreamer-lite's
        // CMakeLists compiles the matroska sources into its plugins
        // object library and gstplugins-lite.c registers the
        // matroskademux element.
        def matroskaDir = project.findProperty('gstMatroskaDir')
        if (matroskaDir) {
            cmakeArgs << "-DOPENJFX_GST_MATROSKA_DIR=${matroskaDir}"
        }
        // bgfx source tree (3D pipeline). The skiafx.bgfx-conventions
        // plugin sets `ext.bgfxDir` (user-supplied or auto-fetch output
        // dir). The 3D CMakeLists guards on the dir existing, so passing
        // a not-yet-fetched path is harmless (the stub build ignores it).
        def bgfxDir = project.findProperty('bgfxDir')
        if (bgfxDir) {
            cmakeArgs << "-DOPENJFX_BGFX_DIR=${bgfxDir}"
        }
        args cmakeArgs
    }

    def buildTask = tasks.register('nativeBuild', Exec) {
        group = 'build'
        description = "CMake build (${hostPlatform}-${hostArch})."
        dependsOn configureTask

        executable 'cmake'
        def buildArgs = ['--build', nativeBuildDir.get().asFile.absolutePath, '--parallel']
        if (useMsvc) {
            buildArgs += ['--config', buildType]
        }
        args buildArgs
    }

    // generateChecksums — SHA-256 manifest for every native lib this
    // module produces. Mirrors jux-framework's generateChecksums task.
    //
    // The manifest (checksums.properties) ships at the JAR ROOT next to
    // the libs themselves. Each line maps the jar-root RESOURCE PATH of a
    // lib to its SHA-256 hash, e.g.:
    //
    //     /glass.dll=adc51d985f2d7c632ef410600484985e077a0f380...
    //
    // The key format ("/" + filename) is exactly what
    // com.sun.glass.utils.NativeLibLoader looks up at runtime
    // ("/" + System.mapLibraryName(name)), so the loader can decide
    // whether a cached extraction is current WITHOUT re-hashing the
    // (possibly large) resource stream — and force an override when a
    // freshly recompiled binary changes the hash. See NativeLibLoader.
    def checksumsOutDir = layout.buildDirectory.dir("generated/checksums/${hostPlatform}-${hostArch}")
    def libDirProvider = nativeBuildDir.map { it.dir('lib') }
    def generateChecksums = tasks.register('generateChecksums') {
        group = 'build'
        description = 'Generate SHA-256 checksums.properties for native libraries.'
        dependsOn buildTask

        def outFileProvider = checksumsOutDir.map { it.file('checksums.properties') }
        inputs.dir(libDirProvider).optional(true).withPropertyName('nativeLibDir')
        outputs.file(outFileProvider).withPropertyName('checksumsFile')

        doLast {
            def libDir = libDirProvider.get().asFile
            def sb = new StringBuilder()
            if (libDir.exists()) {
                def entries = []
                libDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    def lower = f.name.toLowerCase()
                    if (!(lower.endsWith('.dll') || lower.endsWith('.so') || lower.endsWith('.dylib'))) {
                        return
                    }
                    // Key == jar-root resource path. The Jar task below
                    // drops these libs at the jar root preserving their
                    // path relative to lib/, so the resource path is
                    // "/" + that relative path (flat in practice).
                    def rel = libDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                    def digest = java.security.MessageDigest.getInstance('SHA-256')
                    def buf = new byte[8192]
                    f.withInputStream { ins ->
                        int n
                        while ((n = ins.read(buf)) != -1) {
                            digest.update(buf, 0, n)
                        }
                    }
                    def hex = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
                    entries << "/${rel}=${hex}".toString()
                }
                entries.sort().each { sb.append(it).append('\n') }
            }
            def out = outFileProvider.get().asFile
            out.parentFile.mkdirs()
            out.text = sb.toString()
            logger.lifecycle("Generated native checksums manifest: ${out}")
        }
    }

    nativeCompileTask.configure { dependsOn buildTask, generateChecksums }

    // Wire nativeCompile into the standard `assemble` lifecycle so a
    // top-level `buildAll` produces native libs alongside the jar
    // without having to explicitly call `./gradlew nativeCompile`
    // first. The jar itself depends on nativeCompile via the Jar
    // `from(...)` below (Gradle auto-wires the Copy input dep), but
    // making assemble compile natives explicitly is cleaner.
    tasks.named('assemble') { dependsOn nativeCompileTask }

    // Natives ship INSIDE the module jar — ONE artifact per module, with
    // the host triple in its name since the contents are platform-specific.
    // A host build on Windows produces:
    //
    //   javafx.graphics-<version>-win-x64.jar  (classes + module-info
    //                                            + *.dll + checksums.properties)
    //
    // (Reverted from the earlier two-jar split — a separate natives-only
    // classifier jar per module — by request: one jar per module, binaries
    // included.) Each host builds only its own platform jar (Windows ->
    // -win-x64, macOS -> -mac-x64, Linux -> -linux-x64); building for other
    // platforms means re-running this on that host.
    //
    // Native libs sit at the JAR ROOT — that's where
    // com.sun.glass.utils.NativeLibLoader looks them up:
    //
    //   String reallib = "/" + System.mapLibraryName(libraryName);
    //   InputStream is = caller.getResourceAsStream(reallib);
    //
    // (see NativeLibLoader.java#installLibraryFromResource). With the libs
    // in the SAME jar as the loading class this works on both the classpath
    // AND the JPMS module path (a class can always read its own module's
    // resources); the existing cache-and-extract logic unpacks into
    // ~/.skia-fx/cache/ on first load. The loose sdk/lib/<triple>/ files
    // remain as the java.library.path fallback (see skiafx.sdk-conventions).
    tasks.named('jar', Jar) {
        dependsOn nativeCompileTask, generateChecksums
        archiveClassifier.set("${hostPlatform}-${hostArch}")
        from(nativeBuildDir.map { it.dir('lib') }) {
            include '**/*.so', '**/*.dll', '**/*.dylib'
            // NO `into` clause — drop at jar root (NativeLibLoader lookup).
        }
        // Ship the SHA-256 manifest alongside the libs, at the jar root.
        from(checksumsOutDir) {
            include 'checksums.properties'
        }
    }
}
